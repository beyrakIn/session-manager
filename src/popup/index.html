<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Session Manager</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header>
      <strong id="site">…</strong>
    </header>

    <div id="notice" hidden></div>

    <form id="unlock-form" hidden>
      <p class="lock-copy">Locked. Enter your password to use your saved sessions.</p>
      <input
        id="unlock-pass"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      />
      <button type="submit">Unlock</button>
    </form>

    <ul id="profiles"></ul>

    <form id="save-form">
      <input id="name" placeholder="Profile name" required maxlength="40" autocomplete="off" />
      <div class="row">
        <div id="colors"></div>
        <input id="emoji" placeholder="🙂" maxlength="4" title="Optional emoji label" />
      </div>
      <button type="submit">Save current session as profile</button>
    </form>

    <div class="row actions">
      <button id="fresh" title="Switch to a logged-out session">Fresh session</button>
      <button id="export">Export</button>
      <button id="import-btn">Import</button>
      <input type="file" id="import-file" accept="application/json" hidden />
    </div>
    <p class="hint">
      Copy a session with ⧉, paste one with Ctrl+V. Exported and copied
      sessions contain login credentials — treat them like passwords.
      <button id="manage-all" type="button" class="linkish">Manage all sessions</button>
    </p>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
